# Render Blueprint for the portfolio: a free static site, no server to run.
services:
  - type: web
    name: babrit-portfolio
    runtime: static
    buildCommand: ""
    staticPublishPath: .
    headers:
      - path: /posts/*
        name: Cache-Control
        value: no-cache
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=86400
